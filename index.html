<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>02</title>
  <style>
    :root {
      /* Rectángulo vertical */
      --ancho: 120px;
      --alto: 260px;
      --fondo: 80px;
      /* Tamaño del piso */
      --piso: 5000px;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(#ecebf5, #f6f5fa 55%);
      perspective: 900px;
      touch-action: none;
      user-select: none;
      cursor: grab;
    }
    body.arrastrando { cursor: grabbing; }

    /* El mundo: piso, sombra y rectángulo. No se mueve solo;
       la "cámara" se controla con el mouse desde el script. */
    .mundo {
      position: relative;
      will-change: transform;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
    }

    /* Piso plano grande con cuadrícula, que se pierde a lo lejos.
       Se dibuja a la mitad de tamaño y se agranda x2: se ve igual
       pero cuesta mucho menos y la página va más fluida. */
    .piso {
      position: absolute;
      width: calc(var(--piso) / 2);
      height: calc(var(--piso) / 2);
      left: calc(var(--piso) / -4);
      top: calc(var(--piso) / -4);
      transform: rotateX(90deg) scale(2);
      will-change: transform;
      background-color: #dcd6ee;
      background-image:
        linear-gradient(#cbc2e8 1px, transparent 1px),
        linear-gradient(90deg, #cbc2e8 1px, transparent 1px);
      background-size: 25px 25px;
      background-position: center;
      -webkit-mask-image: radial-gradient(circle, #000 12%, transparent 45%);
              mask-image: radial-gradient(circle, #000 12%, transparent 45%);
    }

    .jugador {
      position: absolute;
      will-change: transform;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
    }

    /* Sombra suave en el piso, debajo del rectángulo */
    .sombra {
      position: absolute;
      width: var(--ancho);
      height: var(--fondo);
      left: calc(var(--ancho) / -2);
      top: calc(var(--fondo) / -2);
      transform: translateY(-1px) rotateX(90deg) scale(1.3);
      background: rgba(40, 20, 90, 0.35);
      filter: blur(12px);
      border-radius: 10px;
    }

    /* El rectángulo, parado con la base sobre el piso */
    .rectangulo {
      position: absolute;
      width: var(--ancho);
      height: var(--alto);
      left: calc(var(--ancho) / -2);
      top: calc(var(--alto) * -1);
      transform-style: preserve-3d;
    }

    .cara {
      position: absolute;
      left: 50%;
      top: 50%;
      border: 2px solid #3b2a6b;
      box-sizing: border-box;
    }

    .frente, .atras {
      width: var(--ancho);
      height: var(--alto);
      margin-left: calc(var(--ancho) / -2);
      margin-top: calc(var(--alto) / -2);
    }
    .frente { background: #7b5cd6; transform: translateZ(calc(var(--fondo) / 2)); }
    .atras  { background: #5a3fb0; transform: rotateY(180deg) translateZ(calc(var(--fondo) / 2)); }

    .derecha, .izquierda {
      width: var(--fondo);
      height: var(--alto);
      margin-left: calc(var(--fondo) / -2);
      margin-top: calc(var(--alto) / -2);
    }
    .derecha   { background: #6a4cc4; transform: rotateY(90deg)  translateZ(calc(var(--ancho) / 2)); }
    .izquierda { background: #6a4cc4; transform: rotateY(-90deg) translateZ(calc(var(--ancho) / 2)); }

    .arriba, .abajo {
      width: var(--ancho);
      height: var(--fondo);
      margin-left: calc(var(--ancho) / -2);
      margin-top: calc(var(--fondo) / -2);
    }
    .arriba { background: #9a80e8; transform: rotateX(90deg)  translateZ(calc(var(--alto) / 2)); }
    .abajo  { background: #4a3296; transform: rotateX(-90deg) translateZ(calc(var(--alto) / 2)); }

    .ayuda {
      position: fixed;
      bottom: 16px;
      left: 0;
      right: 0;
      text-align: center;
      font: 14px system-ui, sans-serif;
      color: #6b6290;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="mundo">
    <div class="piso"></div>
    <!-- El jugador: rectángulo + su sombra, se mueven juntos -->
    <div class="jugador">
      <div class="sombra"></div>
      <div class="rectangulo">
        <div class="cara frente"></div>
        <div class="cara atras"></div>
        <div class="cara derecha"></div>
        <div class="cara izquierda"></div>
        <div class="cara arriba"></div>
        <div class="cara abajo"></div>
      </div>
    </div>
  </div>

  <div class="ayuda">W A S D: mover el rectángulo · Flechas o arrastrar: mover la cámara · Rueda: acercar o alejar</div>

  <script>
    const mundo = document.querySelector('.mundo');
    const ALTO = 260; // igual que --alto

    // ===== Ajustes (cámbialos a gusto) =====
    const SENSIBILIDAD   = 0.25;  // grados que gira la cámara por cada píxel que arrastras
    const SUAVIDAD_CAM   = 14;    // más alto = la cámara responde más rápido
    const SUAVIDAD_SEGUIR = 8;    // qué tan rápido la cámara alcanza al rectángulo
    const VELOCIDAD      = 320;   // velocidad máxima del rectángulo (píxeles por segundo)
    const ACELERACION    = 10;    // qué tan rápido arranca y frena
    const BORDE          = 1500;  // no salir del piso
    const GIRO_FLECHAS   = 100;   // grados por segundo que gira la cámara con ← →
    const ALTURA_FLECHAS = 60;    // grados por segundo que sube o baja la cámara con ↑ ↓

    // Cámara que orbita alrededor del rectángulo y siempre lo mira.
    // "objetivo" es hacia donde va la cámara; "actual" la sigue suavemente.
    const objetivo = { giro: -30, inclinacion: -15, distancia: 500 };
    const actual   = { ...objetivo };

    const LIMITES = {
      inclinacion: [-70, -2],   // nunca por debajo del piso
      distancia:   [150, 800],
    };
    const limitar = (v, [min, max]) => Math.max(min, Math.min(max, v));

    // Acerca "valor" a "meta" de forma suave, igual sin importar los FPS
    const suavizar = (valor, meta, rapidez, dt) =>
      valor + (meta - valor) * (1 - Math.exp(-rapidez * dt));

    // ---- Movimiento del rectángulo con W A S D ----
    const jugador = document.querySelector('.jugador');
    const pos = { x: 0, z: 0 };     // posición del rectángulo sobre el piso
    const vel = { x: 0, z: 0 };     // velocidad actual (para arrancar y frenar suave)
    const camPos = { x: 0, z: 0 };  // punto que mira la cámara (sigue al rectángulo)
    const teclas = new Set();

    const TECLAS_USADAS = [
      'KeyW', 'KeyA', 'KeyS', 'KeyD',                     // mover el rectángulo
      'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown',  // mover la cámara
    ];
    document.addEventListener('keydown', e => {
      if (TECLAS_USADAS.includes(e.code)) {
        teclas.add(e.code);
        e.preventDefault();
      }
    });
    document.addEventListener('keyup', e => teclas.delete(e.code));
    // Si cambias de ventana con una tecla apretada, que no se quede caminando solo
    window.addEventListener('blur', () => teclas.clear());

    function moverJugador(dt) {
      // Dirección según las teclas apretadas (se pueden combinar)
      let adelante = 0, derecha = 0;
      if (teclas.has('KeyW')) adelante += 1;
      if (teclas.has('KeyS')) adelante -= 1;
      if (teclas.has('KeyD')) derecha  += 1;
      if (teclas.has('KeyA')) derecha  -= 1;

      // En diagonal no debe ir más rápido que en línea recta
      const largo = Math.hypot(adelante, derecha) || 1;
      adelante /= largo;
      derecha  /= largo;

      // "Adelante" es hacia donde mira la cámara
      const g = actual.giro * Math.PI / 180;
      const metaX = (Math.sin(g) * adelante + Math.cos(g) * derecha) * VELOCIDAD;
      const metaZ = (-Math.cos(g) * adelante + Math.sin(g) * derecha) * VELOCIDAD;

      // Acelerar o frenar suavemente hacia esa velocidad
      vel.x = suavizar(vel.x, metaX, ACELERACION, dt);
      vel.z = suavizar(vel.z, metaZ, ACELERACION, dt);

      pos.x = limitar(pos.x + vel.x * dt, [-BORDE, BORDE]);
      pos.z = limitar(pos.z + vel.z * dt, [-BORDE, BORDE]);

      // La cámara sigue al rectángulo con un pequeño retraso
      camPos.x = suavizar(camPos.x, pos.x, SUAVIDAD_SEGUIR, dt);
      camPos.z = suavizar(camPos.z, pos.z, SUAVIDAD_SEGUIR, dt);
    }

    // Flechas: la cámara da vueltas alrededor del rectángulo, siempre mirándolo
    function moverCamaraConFlechas(dt) {
      if (teclas.has('ArrowLeft'))  objetivo.giro += GIRO_FLECHAS * dt;   // cámara hacia la izquierda
      if (teclas.has('ArrowRight')) objetivo.giro -= GIRO_FLECHAS * dt;   // cámara hacia la derecha
      if (teclas.has('ArrowUp'))    objetivo.inclinacion -= ALTURA_FLECHAS * dt; // subir (mirar más desde arriba)
      if (teclas.has('ArrowDown'))  objetivo.inclinacion += ALTURA_FLECHAS * dt; // bajar (más a ras del piso)
      objetivo.inclinacion = limitar(objetivo.inclinacion, LIMITES.inclinacion);
    }

    function dibujar() {
      jugador.style.transform = `translate3d(${pos.x}px, 0, ${pos.z}px)`;
      // Mover la cámara equivale a mover el mundo al revés frente a ella.
      mundo.style.transform =
        `translateZ(${-actual.distancia}px)` +
        ` rotateX(${actual.inclinacion}deg)` +
        ` rotateY(${actual.giro}deg)` +
        ` translate3d(${-camPos.x}px, ${ALTO / 2}px, ${-camPos.z}px)`;
    }

    let antes = performance.now();
    function animar(ahora) {
      const dt = Math.min((ahora - antes) / 1000, 0.05);
      antes = ahora;
      moverCamaraConFlechas(dt);
      for (const k of ['giro', 'inclinacion', 'distancia']) {
        actual[k] = suavizar(actual[k], objetivo[k], SUAVIDAD_CAM, dt);
      }
      moverJugador(dt);
      dibujar();
      requestAnimationFrame(animar);
    }

    // Arrastrar: mover la cámara alrededor del rectángulo
    let arrastrando = false;

    document.addEventListener('pointerdown', e => {
      arrastrando = true;
      document.body.setPointerCapture(e.pointerId); // no se corta si sales de la ventana
      document.body.classList.add('arrastrando');
    });

    document.addEventListener('pointermove', e => {
      if (!arrastrando) return;
      objetivo.giro += e.movementX * SENSIBILIDAD;
      objetivo.inclinacion = limitar(
        objetivo.inclinacion - e.movementY * SENSIBILIDAD * 0.8,
        LIMITES.inclinacion
      );
    });

    function soltar() {
      arrastrando = false;
      document.body.classList.remove('arrastrando');
    }
    document.addEventListener('pointerup', soltar);
    document.addEventListener('pointercancel', soltar);

    // Rueda del mouse: acercar o alejar (proporcional, se siente parejo)
    document.addEventListener('wheel', e => {
      e.preventDefault();
      const paso = Math.max(-1, Math.min(1, e.deltaY / 100));
      objetivo.distancia = limitar(
        objetivo.distancia * (1 + paso * 0.15),
        LIMITES.distancia
      );
    }, { passive: false });

    requestAnimationFrame(animar);
  </script>
</body>
</html>
