<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>02</title>
  <style>
    :root {
      --ancho: 240px;
      --alto: 140px;
      --fondo: 100px;
      --suelo: 800px;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f8;
      perspective: 1000px;
      touch-action: none;
      user-select: none;
      cursor: grab;
    }
    body.arrastrando { cursor: grabbing; }

    /* Todo lo que gira junto: suelo, sombra y caja */
    .escena {
      position: relative;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
    }

    /* Terreno plano con cuadrícula, que se desvanece en los bordes */
    .suelo {
      position: absolute;
      width: var(--suelo);
      height: var(--suelo);
      left: calc(var(--suelo) / -2);
      top: calc(var(--suelo) / -2);
      transform: translateY(calc(var(--alto) / 2)) rotateX(90deg);
      background-color: #dcd6ee;
      background-image:
        linear-gradient(#c3b9e3 1px, transparent 1px),
        linear-gradient(90deg, #c3b9e3 1px, transparent 1px);
      background-size: 40px 40px;
      background-position: center;
      -webkit-mask-image: radial-gradient(circle, #000 45%, transparent 70%);
              mask-image: radial-gradient(circle, #000 45%, transparent 70%);
    }

    /* Sombra suave debajo de la caja */
    .sombra {
      position: absolute;
      width: var(--ancho);
      height: var(--fondo);
      left: calc(var(--ancho) / -2);
      top: calc(var(--fondo) / -2);
      transform: translateY(calc(var(--alto) / 2 - 1px)) rotateX(90deg) scale(1.15);
      background: rgba(40, 20, 90, 0.35);
      filter: blur(14px);
      border-radius: 12px;
    }

    .caja {
      position: absolute;
      width: var(--ancho);
      height: var(--alto);
      left: calc(var(--ancho) / -2);
      top: calc(var(--alto) / -2);
      transform-style: preserve-3d;
    }

    .cara {
      position: absolute;
      left: 50%;
      top: 50%;
      border: 2px solid #3b2a6b;
      box-sizing: border-box;
    }

    /* Caras grandes: frente y atrás */
    .frente, .atras {
      width: var(--ancho);
      height: var(--alto);
      margin-left: calc(var(--ancho) / -2);
      margin-top: calc(var(--alto) / -2);
    }
    .frente { background: #7b5cd6; transform: translateZ(calc(var(--fondo) / 2)); }
    .atras  { background: #5a3fb0; transform: rotateY(180deg) translateZ(calc(var(--fondo) / 2)); }

    /* Caras laterales: derecha e izquierda */
    .derecha, .izquierda {
      width: var(--fondo);
      height: var(--alto);
      margin-left: calc(var(--fondo) / -2);
      margin-top: calc(var(--alto) / -2);
    }
    .derecha   { background: #6a4cc4; transform: rotateY(90deg)  translateZ(calc(var(--ancho) / 2)); }
    .izquierda { background: #6a4cc4; transform: rotateY(-90deg) translateZ(calc(var(--ancho) / 2)); }

    /* Caras de arriba y abajo */
    .arriba, .abajo {
      width: var(--ancho);
      height: var(--fondo);
      margin-left: calc(var(--ancho) / -2);
      margin-top: calc(var(--fondo) / -2);
    }
    .arriba { background: #9a80e8; transform: rotateX(90deg)  translateZ(calc(var(--alto) / 2)); }
    .abajo  { background: #4a3296; transform: rotateX(-90deg) translateZ(calc(var(--alto) / 2)); }
  </style>
</head>
<body>
  <div class="escena">
    <div class="suelo"></div>
    <div class="sombra"></div>
    <div class="caja">
      <div class="cara frente"></div>
      <div class="cara atras"></div>
      <div class="cara derecha"></div>
      <div class="cara izquierda"></div>
      <div class="cara arriba"></div>
      <div class="cara abajo"></div>
    </div>
  </div>

  <script>
    const escena = document.querySelector('.escena');
    let rotX = -25, rotY = -30;
    let arrastrando = false, ultimoX = 0, ultimoY = 0;
    let girarSolo = !matchMedia('(prefers-reduced-motion: reduce)').matches;

    function dibujar() {
      // No dejar que la cámara pase por debajo del suelo
      rotX = Math.max(-85, Math.min(-5, rotX));
      escena.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
    }

    // Gira solo hasta que lo toques por primera vez
    function animar() {
      if (girarSolo && !arrastrando) {
        rotY += 0.3;
        dibujar();
      }
      requestAnimationFrame(animar);
    }

    // Se puede arrastrar desde cualquier parte de la página
    document.addEventListener('pointerdown', e => {
      arrastrando = true;
      girarSolo = false;
      ultimoX = e.clientX;
      ultimoY = e.clientY;
      document.body.classList.add('arrastrando');
    });

    document.addEventListener('pointermove', e => {
      if (!arrastrando) return;
      rotY += (e.clientX - ultimoX) * 0.5;
      rotX -= (e.clientY - ultimoY) * 0.5;
      ultimoX = e.clientX;
      ultimoY = e.clientY;
      dibujar();
    });

    function soltar() {
      arrastrando = false;
      document.body.classList.remove('arrastrando');
    }
    document.addEventListener('pointerup', soltar);
    document.addEventListener('pointercancel', soltar);

    dibujar();
    animar();
  </script>
</body>
</html>
